{{- $root := . }}
{{- range $name, $cfg := .Values.cronjobs }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "ticketodo.name" $root }}-{{ $name }}
  labels:
    {{- include "ticketodo.labels" $root | nindent 4 }}
    app.kubernetes.io/component: cron-{{ $name }}
spec:
  schedule: {{ $cfg.schedule | quote }}
  {{- with $cfg.timeZone }}
  timeZone: {{ . | quote }}
  {{- end }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 600
  jobTemplate:
    spec:
      {{- include "ticketodo.taskJobSpec" (dict "root" $root "name" $name "cfg" $cfg "component" (printf "cron-%s" $name)) | nindent 6 }}
{{- end }}
