# 部署起点：复制成 values.prod.yaml 后填写，步骤见 README「部署」。
# ⚠️ 敏感值一个都不填在这里，放在预先建好的 Secret 里（DATABASE_URL、BETTER_AUTH_SECRET、
# AUTHENTIK_CLIENT_SECRET 三个键）。

secretName: ticketodo-app

# ⚠️ 每次改 Secret 都要 bump
secretVersion: "2026-11-03"

env:
  AUTHENTIK_DISCOVERY_URL: https://sso.example.com/application/o/ticketodo/.well-known/openid-configuration
  AUTHENTIK_CLIENT_ID: ticketodo
  BOOTSTRAP_ADMIN_EMAILS: admin@example.com

ingress:
  enabled: true
  className: nginx
  # BETTER_AUTH_URL 从它派生
  host: ticketodo.example.com
  tls: true

server:
  replicas: 2
