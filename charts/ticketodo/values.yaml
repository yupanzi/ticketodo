# 默认值；部署时用 -f 覆盖（从 values.example.yaml 起步）。chart 不自建 Secret。

# 资源名前缀，留空即 chart 名
nameOverride: ""

image:
  # 默认即发版推的镜像（ci.yml 的 IMAGE）。⚠️ IMAGE 由仓库路径派生，仓库改名 / 转移后这里要手改。
  # 所有 Pod 共用，靠 command 区分入口
  repository: ghcr.io/yupanzi/ticketodo
  # 留空即 Chart.yaml 的 appVersion（release 时两者一起 bump）。别填 latest：IfNotPresent 下
  # 节点上有旧的 latest 就不再拉，各节点跑的版本会不一样
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

# 凭证的默认来源：每个组件只注入自己 secretKeys 里列的键，env 里没给的取这个 Secret 的同名键。
# 列到的键都在 env 里给了就可以留空
secretName: ticketodo-app

# ⚠️ 改了 Secret 必须 bump 这个值（任意字符串），否则常驻进程还拿着旧值
secretVersion: ""

# 从这里到 resources 三类 Pod 共用；server / migration / cronjobs.<name> 里写了同名项（非空）就
# 整个替换，只有 env 按键合并。
# env 的值写字符串即 value，写对象即 EnvVar 去掉 name 原样透传（valueFrom 等），留空不渲染。
# ⚠️ 凭证写成字符串会留在 release 历史里（helm get values 可读），优先用 valueFrom：
#   DATABASE_URL:
#     valueFrom: { secretKeyRef: { name: pg-app, key: uri } }
env:
  # 对外 origin（不带路径），回调地址是它加 /api/auth/callback/authentik；留空即从 ingress.host 派生。
  # 是否信任 x-forwarded-for / x-request-id 由它的协议决定（https = 信任）：
  # ⚠️ 前提是代理覆盖（而非透传）x-forwarded-*，且不可绕过代理直连
  BETTER_AUTH_URL: ""

  # authentik 里本应用的 discovery 地址与 client id（不是机密；client secret 在 Secret 里）
  AUTHENTIK_DISCOVERY_URL: ""
  AUTHENTIK_CLIENT_ID: ""

  # 系统里还没有管理员时，这些邮箱的人登录即成为管理员（逗号分隔）
  BOOTSTRAP_ADMIN_EMAILS: ""

  # fatal / error / warn / info / debug / trace / silent，留空即 info
  LOG_LEVEL: ""
podAnnotations: {}
podLabels: {}
podSecurityContext: {}
securityContext: {}
nodeSelector: {}
tolerations: []
affinity: {}
resources:
  requests: { cpu: 50m, memory: 128Mi }
  limits: { memory: 512Mi }

server:
  # 无状态（会话、数据都在 PG），可水平扩。⚠️ better-auth 的登录限流在进程内存里，按副本各算各的
  replicas: 2
  secretKeys: [DATABASE_URL, BETTER_AUTH_SECRET, AUTHENTIK_CLIENT_SECRET]
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 1Gi }

service:
  type: ClusterIP
  annotations: {}

# 键名即 dist/bin/cron 下的入口文件名（不带扩展名），所以不能带连字符。backoffLimit 必须显式给。
cronjobs:
  dueremind:
    # 到期提醒：明天到期 / 已逾期的单子给负责人发站内通知。重跑幂等，漏跑下次补上
    schedule: "0 9 * * *"
    # k8s ≥ 1.27；更老的集群删掉这行，schedule 改成 UTC（'0 1 * * *'）
    timeZone: Asia/Shanghai
    secretKeys: [DATABASE_URL]
    backoffLimit: 2

ingress:
  enabled: true
  # 留空不渲染 ingressClassName，用集群默认的 IngressClass
  className: nginx
  host: ""
  annotations: {}
  tls: true
  # 留空即 <name>-tls
  tlsSecretName: ""

migration:
  enabled: true
  secretKeys: [DATABASE_URL]
